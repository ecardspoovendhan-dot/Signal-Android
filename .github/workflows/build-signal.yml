name: Build Signal
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Fit the build into the runner's memory
        run: |
          sed -i 's/-Xmx12g/-Xmx5g/' gradle.properties
          sed -i 's/kotlin.daemon.jvmargs=-Xmx4g/kotlin.daemon.jvmargs=-Xmx2g/' gradle.properties
      - name: Accept Android SDK licenses
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          yes 2>/dev/null | "$SDK" --licenses > /dev/null || true
          echo "Platforms available for download:"
          "$SDK" --list 2>/dev/null | grep -E "platforms;android-3[6-9]" | sort -u || true
      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assemblePlayProdDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: signal-debug-apk
          path: app/build/outputs/apk/**/debug/*.apk
          if-no-files-found: error