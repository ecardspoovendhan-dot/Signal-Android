name: Build Signal
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Fit the build into the runner's memory
        run: |
          sed -i 's/-Xmx12g/-Xmx5g/' gradle.properties
          sed -i 's/kotlin.daemon.jvmargs=-Xmx4g/kotlin.daemon.jvmargs=-Xmx2g/' gradle.properties
      - name: Accept Android SDK licenses
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          yes 2>/dev/null | "$SDK" --licenses > /dev/null || true
      - name: Build debug APK
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew :Signal-Android:assemblePlayProdDebug 2>&1 | tee build.log
      - name: Show build error on the run page
        if: failure()
        run: |
          touch build.log
          MSG=$(grep -A 25 "What went wrong" build.log | head -40)
          [ -z "$MSG" ] && MSG=$(tail -40 build.log)
          { echo '## Build error'; echo '```'; echo "$MSG"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          ENC=$(printf '%s' "$MSG" | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
          echo "::error title=Gradle error::$ENC"
      - uses: actions/upload-artifact@v4
        with:
          name: signal-debug-apk
          path: app/build/outputs/apk/**/debug/*.apk
          if-no-files-found: error