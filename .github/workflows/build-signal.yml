name: Build Signal
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Free disk space and add swap
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/.ghcup
          sudo fallocate -l 8G /mnt/extra.swap
          sudo chmod 600 /mnt/extra.swap
          sudo mkswap /mnt/extra.swap
          sudo swapon /mnt/extra.swap
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Fit the build into the runner's memory
        run: |
          sed -i 's/-Xmx12g/-Xmx10g/' gradle.properties
          echo "" >> gradle.properties
          echo "kotlin.compiler.execution.strategy=in-process" >> gradle.properties
          echo "org.gradle.workers.max=2" >> gradle.properties
      - name: Add the Today's Brief gate (test copy)
        run: TEST_COPY=true python3 newsgate/apply-patch.py
      - name: Accept Android SDK licenses
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          yes 2>/dev/null | "$SDK" --licenses > /dev/null || true
      - name: Build debug APK
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew :Signal-Android:assemblePlayProdDebug 2>&1 | tee build.log
      - name: Show build error on the run page
        if: failure()
        run: |
          touch build.log
          MSG=$(grep -B 2 -A 25 "What went wrong\|^e: " build.log | head -60)
          [ -z "$MSG" ] && MSG=$(tail -40 build.log)
          { echo '## Build error'; echo '```'; echo "$MSG"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          ENC=$(printf '%s' "$MSG" | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
          echo "::error title=Gradle error::$ENC"
      - uses: actions/upload-artifact@v4
        with:
          name: signal-test-apk
          path: app/build/outputs/apk/**/debug/*arm64-v8a*.apk
          if-no-files-found: error
